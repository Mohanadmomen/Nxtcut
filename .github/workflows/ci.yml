name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-architecture:
    name: Lint and architecture
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify architecture boundaries
        run: python scripts/check_architecture.py

      - name: Install pinned clang-format
        run: python -m pip install clang-format==18.1.8

      - name: Check formatting
        run: clang-format --dry-run -Werror $(git ls-files '*.cpp' '*.hpp')

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC 13 (Debug)
            os: ubuntu-24.04
            preset: debug
            cc: gcc-13
            cxx: g++-13
          - name: Ubuntu Clang 17 (Debug)
            os: ubuntu-24.04
            preset: debug
            cc: clang-17
            cxx: clang++-17
          - name: Windows MSVC (Debug)
            os: windows-latest
            preset: windows-debug
          - name: macOS Apple Clang (Debug)
            os: macos-latest
            preset: debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: bash
        run: |
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -d "${VCPKG_INSTALLATION_ROOT}" ]; then
            echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"
          BASELINE="$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")"
          git -C "${VCPKG_INSTALLATION_ROOT}" fetch --quiet origin "$BASELINE" || git -C "${VCPKG_INSTALLATION_ROOT}" fetch --quiet --unshallow origin || git -C "${VCPKG_INSTALLATION_ROOT}" fetch --quiet origin
          else
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "${RUNNER_TEMP}/vcpkg"
            "${RUNNER_TEMP}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> "$GITHUB_ENV"
          fi
          # The preinstalled vcpkg clone can be shallow/stale and miss the builtin-baseline commit.
          BASELINE="$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")"
          VCPKG_DIR="${VCPKG_INSTALLATION_ROOT:-${RUNNER_TEMP}/vcpkg}"
          git -C "$VCPKG_DIR" fetch --quiet origin "$BASELINE" || git -C "$VCPKG_DIR" fetch --quiet --unshallow origin || git -C "$VCPKG_DIR" fetch --quiet origin
          mkdir -p "${RUNNER_TEMP}/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-

      - name: Select Linux compiler
        if: runner.os == 'Linux'
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  sanitizers:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            preset: asan-ubsan
          - name: TSan
            preset: tsan
    env:
      CC: clang-17
      CXX: clang++-17
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure